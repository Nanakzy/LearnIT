<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to LearnIT</title>
  <script src="https://code.responsivevoice.org/responsivevoice.js?key=YOUR_KEY"></script>
  <style>
    body {
      font-family: 'Comic Sans MS', sans-serif;
      background-color: #fefae0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      text-align: center;
      max-width: 700px;
      margin: auto;
      padding: 40px;
      background: #fff8dc;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border: 2px solid #ff595e;
    }

    h1 {
      font-size: 4rem;
      color: #ff595e;
      margin: 20px 0;
    }

    h2 {
      font-size: 2rem;
      color: #1982c4;
      margin: 20px 0;
    }

    .welcome-message {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 40px;
    }

    .cta-button {
      font-size: 1.2rem;
      padding: 15px 30px;
      background: #8ac926;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
    }

    .cta-button:hover {
      background: #6dbb20;
    }

    .image {
      max-width: 200px;
      margin-top: 30px;
    }

    .cta-button {
  font-size: 1.5rem;
  padding: 15px 30px;
  background-color: #4caf50;
  color: white;
  border-radius: 8px;
  text-decoration: none;
  text-align: center;
  display: inline-block;
  margin-top: 20px;
}

.cta-button:hover {
  background-color: #45a049;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to LearnIT</h1>
    <h2>Created by Nana Khuzwayo</h2>
    <p class="welcome-message">Specially created to help beginners learn how to read and write!</p>
    
    <div class="image">
      <img src="images/kids_learning.png" alt="Kids Learning" />
    </div>
    
    <!-- CTA Button -->
    <div class="cta-section">
      <a href="base.html" class="cta-button">Start Learning!</a>
    </div>

  
  </div>

  <script>
    // Announce the welcome message when the page loads
    window.onload = function() {
      responsiveVoice.speak("Welcome to LearnIT, specially created by Nana Khuzwayo to help you read and write.", "UK English Female");
    }
  </script>
</body>
</html>
